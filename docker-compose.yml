services:
  kafka-server1:
    image: apache/kafka:latest
    networks:
      - kafka-net
    volumes:
      - kafka-vol1:/var/lib/kafka/data
    ports:
      - '9092:9092'
    environment:
      CLUSTER_ID: 'iRZLf_1gRSCElKZ7bbX64A'
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://kafka-server1:9095,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka-server1:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-server1:9095,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-server1:9093,2@kafka-server2:9093,3@kafka-server3:9093'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

  kafka-server2:
    image: apache/kafka:latest
    networks:
      - kafka-net
    volumes:
      - kafka-vol2:/var/lib/kafka/data
    ports:
      - '9093:9092'
    environment:
      CLUSTER_ID: 'iRZLf_1gRSCElKZ7bbX64A'
      KAFKA_NODE_ID: '2'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://kafka-server2:9095,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka-server2:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-server2:9095,EXTERNAL://localhost:9093'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-server1:9093,2@kafka-server2:9093,3@kafka-server3:9093'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

  kafka-server3:
    image: apache/kafka:latest
    networks:
      - kafka-net
    volumes:
      - kafka-vol3:/var/lib/kafka/data
    ports:
      - '9094:9092'
    environment:
      CLUSTER_ID: 'iRZLf_1gRSCElKZ7bbX64A'
      KAFKA_NODE_ID: '3'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://kafka-server3:9095,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka-server3:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-server3:9095,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-server1:9093,2@kafka-server2:9093,3@kafka-server3:9093'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

volumes:
  kafka-vol1:
  kafka-vol2:
  kafka-vol3:

networks:
  kafka-net: